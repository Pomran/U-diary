<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>晴れ日記 · U-diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --primary: #5b8a7a;
  --primary-light: #e8f0ed;
  --secondary: #d4a5a5;
  --text: #2d2d2d;
  --text-light: #7a7a7a;
  --text-muted: #b5b0a8;
  --border: #e8e0d5;
  --shadow: 0 10px 25px -5px rgba(91, 138, 122, 0.08);
  --shadow-hover: 0 20px 35px -10px rgba(91, 138, 122, 0.18);
  --radius: 14px;
  --max-w: 1200px;
  --ease-out-cubic: cubic-bezier(0.215, 0.61, 0.355, 1);
  --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #d0c8be; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 200px 200px;
}

header {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column; justify-content: center;
  align-items: center; text-align: center; padding: 2rem 1rem; position: relative; overflow: hidden;
}
header::before {
  content: ''; position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
  background: radial-gradient(circle at 50% 50%, var(--primary-light) 0%, transparent 60%),
              radial-gradient(circle at 75% 35%, rgba(212,165,165,0.18) 0%, transparent 45%);
  will-change: transform;
  transform: translateZ(0);
}

.hero-content { position: relative; z-index: 1; }
.hero-sub {
  font-family: 'Caveat', cursive; font-size: 1.5rem; color: var(--secondary); margin-bottom: 0.5rem; letter-spacing: 0.05em;
  animation: fadeDown 0.8s var(--ease-out-cubic) forwards;
}
.hero-title {
  font-family: 'Playfair Display','Noto Serif SC',serif; font-size: clamp(3rem, 6.5vw, 4.8rem); font-weight: 400; line-height: 1.2; color: var(--text); margin-bottom: 1rem;
  animation: fadeUp 0.8s var(--ease-out-cubic) 0.15s forwards;
  opacity: 0;
}
.hero-title em { font-style: italic; color: var(--primary); font-weight: 600; display: inline-block; transition: transform 0.3s var(--ease-spring); }
.hero-title:hover em { transform: rotate(-6deg) scale(1.1); }
.hero-desc {
  font-size: 1.05rem; color: var(--text-light); max-width: 480px; margin: 0 auto 2.5rem; line-height: 1.8;
  animation: fadeUp 0.8s var(--ease-out-cubic) 0.3s forwards;
  opacity: 0;
}
.hero-scroll {
  font-family: 'Caveat', cursive; font-size: 1.2rem; color: var(--text-muted); user-select: none;
  animation: fadeUp 0.8s var(--ease-out-cubic) 0.45s forwards;
  opacity: 0;
}
.hero-scroll span { display: inline-block; animation: bounce 2.2s infinite; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(6px); } 60% { transform: translateY(3px); } }

nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250, 248, 245, 0.92);
  border-bottom: 1px solid var(--border);
  transform: translateZ(0);
}
@supports (backdrop-filter: blur(12px)) {
  nav {
    background: rgba(250, 248, 245, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
}
.nav-inner { max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 1.5rem; }
.nav-logo { font-family: 'Playfair Display',serif; font-size: 1.2rem; font-weight: 600; color: var(--primary); text-decoration: none; letter-spacing: 0.03em; }

.nav-sorts { display: flex; gap: 0.5rem; }
.nav-sort {
  font-size: 0.88rem; padding: 0.4rem 1.1rem; border-radius: 20px; border: 1px solid transparent;
  background: transparent; color: var(--text-light); cursor: pointer;
  transition: all 0.2s ease; white-space: nowrap; font-family: inherit;
  display: flex; align-items: center; gap: 0.35rem;
}
.nav-sort svg { width: 15px; height: 15px; opacity: 0.7; }
.nav-sort:hover { color: var(--text); background: var(--primary-light); }
.nav-sort.active { color: #fff; background: var(--primary); border-color: var(--primary); box-shadow: 0 3px 10px rgba(91,138,122,0.2); }

.nav-publish {
  font-size: 0.88rem; padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid var(--primary);
  background: var(--primary); color: #fff; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 0.35rem; white-space: nowrap;
  transition: transform 0.2s var(--ease-spring), box-shadow 0.2s ease; flex-shrink: 0;
}
.nav-publish svg { width: 15px; height: 15px; }
.nav-publish:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91,138,122,0.3); }

.stats { text-align: center; padding: 2rem 1.5rem 0.5rem; color: var(--text-muted); font-size: 0.88rem; }
.stats em { font-family: 'Caveat', cursive; color: var(--primary); font-size: 1.25rem; font-style: normal; margin: 0 0.2rem; display: inline-block; }

.gallery {
  max-width: var(--max-w); margin: 0 auto; padding: 1.25rem 1.5rem 3rem;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.75rem;
  min-height: 300px;
}

.photo-card {
  --rx: 0deg;
  --ry: 0deg;
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.4s var(--ease-out-cubic), transform 0.4s var(--ease-out-cubic), box-shadow 0.25s ease;
  will-change: transform, opacity;
  content-visibility: auto;
  contain-intrinsic-size: 300px;
}
.photo-card.show {
  opacity: 1;
  transform: translateY(0) rotateX(var(--rx)) rotateY(var(--ry));
}
@media (hover: hover) {
  .photo-card:hover {
    transform: translateY(-4px) rotateX(var(--rx)) rotateY(var(--ry));
    box-shadow: var(--shadow-hover);
    border-color: rgba(91,138,122,0.3);
  }
}

.photo-img-wrap { position: relative; overflow: hidden; aspect-ratio: 4 / 3; background: #f0eae1; cursor: pointer; }
.photo-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transform: scale(1.03);
  transition: opacity 0.4s ease, transform 0.5s var(--ease-out-cubic);
}
.photo-img-wrap img.loaded { opacity: 1; transform: scale(1); }
.photo-card:hover .photo-img-wrap img.loaded { transform: scale(1.04); }

.photo-author {
  position: absolute; top: 0; left: 0; z-index: 3;
  padding: 0.6rem 0.8rem;
  background: linear-gradient(rgba(0,0,0,0.4), transparent);
  color: #fff; font-size: 0.8rem; font-weight: 500;
  opacity: 0; transition: opacity 0.25s ease;
  pointer-events: none;
}
.photo-card:hover .photo-author { opacity: 1; }

.photo-actions {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  display: flex; gap: 0.5rem; padding: 1.8rem 0.8rem 0.8rem;
  background: linear-gradient(transparent, rgba(0,0,0,0.35));
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.25s ease, transform 0.25s var(--ease-out-cubic);
}
.photo-card:hover .photo-actions { opacity: 1; transform: translateY(0); }
@media (hover: none) {
  .photo-author, .photo-actions { opacity: 1; transform: translateY(0); }
}

.act {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.3rem 0.65rem; border-radius: 20px; border: none; cursor: pointer;
  background: rgba(255,255,255,0.92); color: var(--text); font-size: 0.78rem; font-family: inherit;
  transition: transform 0.2s var(--ease-spring), background 0.2s ease;
}
.act svg { width: 15px; height: 15px; }
.act:hover { transform: translateY(-1px); }
.act-count { font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: left; }

.act-like.liked { color: var(--secondary); background: #ffffff; }
.act-like.liked svg { fill: var(--secondary); stroke: var(--secondary); }

.loader { text-align: center; padding: 2rem 1.5rem 4rem; color: var(--text-muted); font-family: 'Caveat', cursive; font-size: 1.2rem; }
.loader .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; margin-bottom: 0.4rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader .finished-text { display: none; color: var(--primary); letter-spacing: 0.1em; }
.loader.done .spinner, .loader.done .loading-text { display: none; }
.loader.done .finished-text { display: block; }
.loader.hidden { display: none; }

.empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; color: var(--text-muted); font-family: 'Caveat', cursive; font-size: 1.4rem; }

.lightbox {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(15,15,15,0.95);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  will-change: opacity;
}
.lightbox.open { opacity: 1; pointer-events: auto; }
.lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 4rem 4rem 4.5rem; }
.lb-stage img {
  max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px;
  opacity: 0; transform: scale(0.98); transition: opacity 0.3s ease, transform 0.3s var(--ease-out-cubic);
}
.lb-stage img.loaded { opacity: 1; transform: scale(1); }
.lb-top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; }
.lb-counter { color: rgba(255,255,255,0.6); font-family: 'Caveat', cursive; font-size: 1.1rem; }
.lb-close {
  background: rgba(255,255,255,0.12); color: #fff; border: none; cursor: pointer;
  width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s ease, transform 0.2s ease;
}
.lb-close:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
  width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s ease;
}
.lb-nav svg { width: 22px; height: 22px; }
.lb-nav:hover { background: rgba(255,255,255,0.25); }
.lb-prev { left: 1rem; } .lb-next { right: 1rem; }

.lb-info {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 1rem 1.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.7));
}
.lb-left { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.lb-meta { display: flex; gap: 0.6rem; align-items: center; }
.lb-cat { background: rgba(91,138,122,0.85); color: #fff; padding: 0.1rem 0.6rem; border-radius: 10px; font-size: 0.75rem; }
.lb-date { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
.lb-caption { color: rgba(255,255,255,0.9); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-actions { display: flex; gap: 0.5rem; }
.lb-del { background: rgba(255,255,255,0.9); color: var(--text); }
.lb-del:hover { background: #c96f6f; color: #fff; }
.lb-del[hidden] { display: none; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(30,30,30,0.5);
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}
@supports (backdrop-filter: blur(5px)) {
  .modal-backdrop { backdrop-filter: blur(5px); }
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg); border-radius: 16px; overflow: hidden;
  width: min(520px, 100%); max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  transform: translateY(12px); transition: transform 0.25s var(--ease-out-cubic);
}
.modal-backdrop.open .modal { transform: translateY(0); }
.modal-photo { aspect-ratio: 16 / 9; background: #eee; overflow: hidden; }
.modal-photo img { width: 100%; height: 100%; object-fit: cover; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 1rem; font-weight: 600; }
.modal-close { border: none; background: transparent; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); padding: 0.2rem; }

.comment-list { flex: 1; overflow-y: auto; padding: 0.75rem 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; }
.comment-empty { text-align: center; color: var(--text-muted); font-family: 'Caveat', cursive; font-size: 1.1rem; padding: 1.5rem 0; }
.comment-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.8rem; }
.comment-item .c-time { font-size: 0.72rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 0.1rem; }
.comment-item .c-del { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.72rem; }
.comment-item .c-del:hover { color: #c96f6f; }
.comment-item .c-text { font-size: 0.88rem; word-break: break-word; }

.comment-form { display: flex; gap: 0.5rem; padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); background: var(--card-bg); }
.comment-form input {
  flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 0.45rem 0.9rem;
  font-size: 0.88rem; background: var(--bg); color: var(--text); outline: none;
}
.comment-form input:focus { border-color: var(--primary); }
.comment-form button {
  border: none; border-radius: 20px; padding: 0.45rem 1.1rem; cursor: pointer;
  background: var(--primary); color: #fff; font-size: 0.88rem;
}

.pub-body { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.65rem; }
.pub-pick {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  border: 1.5px dashed var(--border); border-radius: 10px; padding: 1rem; cursor: pointer;
  color: var(--text-light); font-size: 0.88rem; transition: background 0.2s ease; min-height: 80px;
}
.pub-pick:hover { border-color: var(--primary); background: var(--primary-light); }
.pub-pick.picked { border-style: solid; border-color: var(--primary); }
.pub-pick img { max-height: 140px; max-width: 100%; border-radius: 6px; }
.pub-input {
  border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.8rem;
  font-size: 0.88rem; background: var(--card-bg); color: var(--text); outline: none;
}
.pub-input:focus { border-color: var(--primary); }
.pub-legend { font-size: 0.75rem; color: var(--text-muted); }
.pub-actions { display: flex; justify-content: flex-end; }
.pub-submit { border: none; border-radius: 20px; padding: 0.5rem 1.3rem; cursor: pointer; background: var(--primary); color: #fff; font-size: 0.88rem; }
.pub-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.pub-error { color: #c96f6f; font-size: 0.8rem; min-height: 1.1em; }

.fb-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; }
.fb-item .fb-time { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
.fb-item .fb-text { font-size: 0.9rem; color: var(--text); word-break: break-word; }

footer { text-align: center; padding: 2.5rem 1.5rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.82rem; background: #f7f4ef; }
footer span { font-family: 'Caveat', cursive; font-size: 1.1rem; color: var(--primary); display: inline-block; }
#feedbackLink:hover { background: var(--primary); color: #fff; }

@media (max-width: 640px) {
  .gallery { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; padding: 1rem; }
  .nav-inner { padding: 0 0.8rem; }
  .nav-logo { display: none; }
  .hero-title { font-size: 2.5rem; }
  .nav-sorts { margin: 0 auto; }
  .lb-stage { padding: 3rem 0.5rem 4rem; }
  .lb-nav { width: 36px; height: 36px; }
  .lb-prev { left: 0.3rem; } .lb-next { right: 0.3rem; }
}
</style>
</head>
<body>

<header>
  <div class="hero-content">
    <div class="hero-sub">✦ My University Diary ✦</div>
    <h1 class="hero-title">晴れ<br>日記<em>.</em></h1>
    <p class="hero-desc">用快门定格了四年的光。<br>翻开这本日记，每一页都是回不去的晴天。</p>
    <div class="hero-scroll"><span>↓</span> 往下翻阅</div>
  </div>
</header>

<nav id="navbar">
  <div class="nav-inner">
    <a class="nav-logo" href="#">晴れ日記</a>
    <div class="nav-sorts" id="sorts">
      <button class="nav-sort active" data-sort="time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        按时间
      </button>
      <button class="nav-sort" data-sort="heat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c4.97 0 9-4.03 9-9 0-6-4.5-9.5-7-11.5-.3-.24-.7-.1-.83.25-.45 1.22-1.13 2.7-2.17 3.78C9.1 7.2 9 4.5 8 3.3c-.13-.17-.35-.22-.53-.15C5.6 4 4 6.5 4 9.5c0 1.5.6 2.87 1.55 3.87"/><path d="M12 22c-2.76 0-5-2.24-5-5 0-1.1.35-2.1.95-2.95"/></svg>
        按热度
      </button>
    </div>
    <button class="nav-publish" id="publishBtn" title="发布一张照片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      发布
    </button>
  </div>
</nav>

<div class="stats" id="stats"></div>
<div class="gallery" id="gallery"></div>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loading-text">加载更多回忆...</div>
  <div class="finished-text">✦ 未完待续 ✦</div>
</div>

<footer>
  <p>✎ photographed with <span>fun</span></p>
  <p style="margin-top:0.3rem;font-size:0.75rem;">每一帧都是青春的切片</p>
  <p style="margin-top:1.2rem;">
    <a href="#" id="feedbackLink" style="display:inline-block;padding:0.35rem 1rem;border:1px solid var(--primary);border-radius:20px;color:var(--primary);text-decoration:none;font-size:0.85rem;transition:all .2s ease;">反馈</a>
  </p>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lb-top">
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-close" id="lbClose" title="关闭">×</button>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev" title="上一张">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="lb-stage" id="lbStage">
    <img id="lbImage" src="" alt="photo">
  </div>
  <button class="lb-nav lb-next" id="lbNext" title="下一张">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div class="lb-info">
    <div class="lb-left">
      <div class="lb-meta">
        <span class="lb-cat" id="lbCat"></span>
        <span class="lb-date" id="lbDate"></span>
      </div>
      <div class="lb-caption" id="lbCaption"></div>
    </div>
    <div class="lb-actions">
      <button class="act lb-action act-like" id="lbLike" data-id="" title="喜爱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="act-count" data-kind="likes">0</span>
      </button>
      <button class="act lb-action act-comment" id="lbComment" data-id="" title="评价">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="act-count" data-kind="comments">0</span>
      </button>
      <button class="act lb-action lb-del" id="lbDel" title="删除我的发布" hidden>删除</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="feedbackModal">

      <div class="pub-error" id="fbError"></div>

        <button class="pub-submit" id="fbSubmit">发送</button>

</div>

<div id="feedbackList" style="display:none;max-width:720px;margin:0 auto;padding:2rem 1.5rem 3rem;">
  <h2 style="font-family:'Noto Serif SC',serif;margin-bottom:1.5rem;color:var(--primary);">反馈汇总</h2>
  <div id="feedbackItems"></div>
</div>

<div class="modal-backdrop" id="publishModal">
  <div class="modal">

        <span id="pubPickText">选择图片</span>
        <input type="file" id="pubFile" accept="image/*" hidden>
      </div>
      <input class="pub-input" id="pubNick" placeholder="你的昵称（中英文 / 数字 / 下划线，1-20 字）" maxlength="20">

      <div class="pub-legend" style="color:var(--text-muted);line-height:1.5;">首次输入昵称时请设置口令（至少 4 位字符）保证昵称唯一，同设备下次无需重复输入。</div>
      <input class="pub-input" id="pubCaption" placeholder="一句说明（可选，最多 120 字）" maxlength="120">

        <button class="pub-submit" id="pubSubmit">发布</button>

<div class="modal-backdrop" id="commentModal">
  <div class="modal">
    <div class="modal-photo"><img id="modalPhoto" src="" alt=""></div>
    <div class="modal-head">
      <h3>评价</h3>
      <button class="modal-close" id="modalClose" title="关闭">×</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <form class="comment-form" id="commentForm">
      <input id="commentInput" type="text" maxlength="200" placeholder="写下这一刻的回忆..." autocomplete="off">
      <button type="submit">发送</button>
    </form>
  </div>
</div>

<script>
const PAGE_SIZE = 12;
const CAT_NAMES = { campus: '校园', travel: '旅行', daily: '日常', people: '人像', night: '夜色' };
let allPhotos = [];
let heatMap = null;
let currentSort = 'time';
let currentIndex = 0;
let loading = false;
let loaded = false;
let modalId = null;
let modalComments = [];
let lbIndex = -1;
let lbList = [];
let lbTouchX = 0;
let shareMap = {};
let ud_device = localStorage.getItem('ud_device');
if (!ud_device) {
  ud_device = 'd-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('ud_device', ud_device);
}

const gallery = document.getElementById('gallery');
const loader = document.getElementById('loader');
const stats = document.getElementById('stats');
const lightbox = document.getElementById('lightbox');
const lbImage = document.getElementById('lbImage');
const lbStage = document.getElementById('lbStage');
const lbCat = document.getElementById('lbCat');
const lbDate = document.getElementById('lbDate');
const lbCounter = document.getElementById('lbCounter');
const lbLike = document.getElementById('lbLike');
const lbComment = document.getElementById('lbComment');
const lbCaption = document.getElementById('lbCaption');
const lbDel = document.getElementById('lbDel');
const publishModal = document.getElementById('publishModal');
const pubFile = document.getElementById('pubFile');
const pubPreview = document.getElementById('pubPreview');
const pubPick = document.getElementById('pubPick');
const pubNick = document.getElementById('pubNick');
const pubSecret = document.getElementById('pubSecret');
const pubCaption = document.getElementById('pubCaption');
const pubSubmit = document.getElementById('pubSubmit');
const pubError = document.getElementById('pubError');
const modal = document.getElementById('commentModal');
const modalPhoto = document.getElementById('modalPhoto');
const commentList = document.getElementById('commentList');
const commentForm = document.getElementById('commentForm');
const commentInput = document.getElementById('commentInput');
const feedbackModal = document.getElementById('feedbackModal');
const fbText = document.getElementById('fbText');
const fbSubmit = document.getElementById('fbSubmit');
const fbError = document.getElementById('fbError');
const feedbackList = document.getElementById('feedbackList');
const feedbackItems = document.getElementById('feedbackItems');

function setScrollLock(lock) {
  document.body.style.overflow = lock ? 'hidden' : '';
}

async function loadPhotos() {
  try {
    const [photosRes, heatRes] = await Promise.all([
      fetch('./photos.json'),
      fetch('./api/heat').catch(() => null),
    ]);
    if (!photosRes.ok) throw new Error('photos.json error');
    allPhotos = await photosRes.json();
    heatMap = (heatRes && heatRes.ok) ? await heatRes.json() : {};
    await refreshFeed();
  } catch (e) {
    heatMap = {};
    try {
      const photosRes = await fetch('./photos.json');
      allPhotos = await photosRes.json();
    } catch (e2) {
      gallery.innerHTML = `<div class="empty-state">✦ 照片加载失败，请检查配置 ✦</div>`;
      loader.classList.add('done');
      return;
    }
  }
  onSort('time');
  handleHash();
}

async function refreshFeed() {
  try {
    const res = await fetch('./api/feed');
    if (!res.ok) return;
    const shares = await res.json();
    shareMap = {};
    allPhotos = allPhotos.filter(p => p.cat !== 'user');
    shares.forEach(s => {
      shareMap[s.photoId] = s;
      allPhotos.push({ id: s.photoId, src: s.src, date: String(s.date).replace(/-/g, '.'), cat: 'user' });
    });
  } catch (e) { }
}

function buildDisplayList() {
  const sorted = [...allPhotos];
  if (currentSort === 'heat' && heatMap) {
    sorted.sort((a, b) => {
      const ha = heatMap[a.id]?.likes || 0;
      const hb = heatMap[b.id]?.likes || 0;
      if (hb !== ha) return hb - ha;
      return String(b.date || '').localeCompare(String(a.date || ''));
    });
  } else {
    sorted.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  }
  return sorted;
}

function onSort(sort) {
  renderNewBatch();
}

function renderNewBatch() {
  const displayList = buildDisplayList();
  currentIndex = 0;
  loaded = false;
  loading = false;

  gallery.innerHTML = '';
  loader.classList.remove('done');
  loader.classList.remove('hidden');
  const sortLabel = currentSort === 'heat' ? '按热度' : '按时间';
  stats.innerHTML = `✦ ${sortLabel} · 共 <em>${displayList.length}</em> 张照片 ✦`;

  if (displayList.length === 0) {
    gallery.innerHTML = `<div class="empty-state">✦ 相册还是空的 ✦</div>`;
    loader.classList.add('hidden');
    return;
  }
  loadMore();
}

function createCardHTML(p) {
  const c = heatMap ? heatMap[p.id] : null;
  const likes = c?.likes || 0;
  const comments = c?.comments || 0;
  const liked = !!localStorage.getItem('liked:' + p.id);
  return `
    <div class="photo-img-wrap" data-id="${p.id}">
      ${p.cat === 'user'
        ? `<div class="photo-author">@${shareMap[p.id]?.nickname || ''}</div>`
        : (p.cat ? `<div class="photo-author">@pr2</div>` : '')}
      <img src="${p.thumb || p.src}" alt="photo" loading="lazy" decoding="async" onload="this.classList.add('loaded')" />
      <div class="photo-actions">
        <button class="act act-like${liked ? ' liked' : ''}" data-id="${p.id}" title="喜爱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="act-count" data-kind="likes">${likes}</span>
        </button>
        <button class="act act-comment" data-id="${p.id}" title="评价">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="act-count" data-kind="comments">${comments}</span>
        </button>
      </div>
    </div>
  `;
}

function loadMore() {
  if (loading || loaded) return;
  loading = true;

  const displayList = buildDisplayList();
  const remaining = displayList.length - currentIndex;
  if (remaining <= 0) {
    loader.classList.add('done');
    loaded = true;
    loading = false;
    return;
  }

  const count = Math.min(PAGE_SIZE, remaining);
  const batch = displayList.slice(currentIndex, currentIndex + count);
  currentIndex += count;

  const fragment = document.createDocumentFragment();
  const newCards = [];

  batch.forEach(p => {
    const card = document.createElement('article');
    card.className = 'photo-card';
    card.innerHTML = createCardHTML(p);
    fragment.appendChild(card);
    newCards.push(card);
  });

  gallery.appendChild(fragment);

  requestAnimationFrame(() => {
    newCards.forEach((card, i) => {
      setTimeout(() => card.classList.add('show'), i * 30);
    });
    loading = false;
  });

  if (currentIndex >= displayList.length) {
    loader.classList.add('done');
    loaded = true;
  }
}

document.getElementById('sorts').addEventListener('click', e => {
  const btn = e.target.closest('.nav-sort');
  if (!btn || btn.classList.contains('active')) return;
  document.querySelectorAll('.nav-sort').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSort = btn.dataset.sort;

  const navTop = document.getElementById('navbar').offsetTop;
  if (window.scrollY > navTop) {
    window.scrollTo({ top: navTop, behavior: 'auto' });
  }
  onSort(currentSort);
});

const observer = new IntersectionObserver(([entry]) => {
  if (entry.isIntersecting) loadMore();
}, { rootMargin: '150px' });
observer.observe(loader);

function setCount(btn, kind, value) {
  const scope = btn.closest('.photo-card') || btn.closest('.lightbox');
  const el = scope?.querySelector(`.act-count[data-kind="${kind}"]`);
  if (el) el.textContent = value;
}

function syncLikes(id, likes) {
  const liked = !!localStorage.getItem('liked:' + id);
  document.querySelectorAll(`.act-like[data-id="${id}"]`).forEach(b => {
    b.classList.toggle('liked', liked);
    const el = b.querySelector('.act-count');
    if (el) el.textContent = likes;
  });
}

function syncComments(id, count) {
  document.querySelectorAll(`.act-comment[data-id="${id}"] .act-count`).forEach(el => el.textContent = count);
}

async function handleLike(btn) {
  const id = btn.dataset.id;
  const liked = !!localStorage.getItem('liked:' + id);
  const action = liked ? 'unlike' : 'like';

  if (liked) {
    localStorage.removeItem('liked:' + id);
    btn.classList.remove('liked');
  } else {
    localStorage.setItem('liked:' + id, '1');
    btn.classList.add('liked');
  }

  const current = parseInt(btn.querySelector('.act-count').textContent || '0', 10);
  setCount(btn, 'likes', Math.max(0, current + (liked ? -1 : 1)));

  try {
    const res = await fetch(`./api/photo/${id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    const data = await res.json();
    if (data.ok) {
      if (heatMap) heatMap[id] = { likes: data.likes, comments: heatMap[id]?.comments || 0 };
      syncLikes(id, data.likes);
    }
  } catch (e) { }
}

function fmtTime(t) {
  const d = new Date(t);
  const diff = Date.now() - t;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function getMyComments(photoId) {
  try { return JSON.parse(localStorage.getItem('myComments:' + photoId) || '[]'); } catch (e) { return []; }
}
function addMyComment(photoId, cid) {
  const arr = getMyComments(photoId);
  if (!arr.includes(cid)) arr.push(cid);
  localStorage.setItem('myComments:' + photoId, JSON.stringify(arr));
}
function removeMyComment(photoId, cid) {
  localStorage.setItem('myComments:' + photoId, JSON.stringify(getMyComments(photoId).filter(c => c !== cid)));
}

function renderComments() {
  const mine = new Set(getMyComments(modalId));
  if (modalComments.length === 0) {
    commentList.innerHTML = `<div class="comment-empty">还没有评价，写下第一条吧 ✦</div>`;
    return;
  }
  commentList.innerHTML = modalComments.map(c => `
    <div class="comment-item">
      <div class="c-time">
        <span>${fmtTime(c.time)}</span>
        ${c.id && mine.has(c.id) ? '<button class="c-del" data-cid="' + c.id + '" title="删除这条评价">删除</button>' : ''}
      </div>
      <div class="c-text">${c.text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
    </div>
  `).join('');
}

async function deleteComment(cid) {
  if (!modalId || !cid) return;
  const photoId = modalId;
  try {
    const res = await fetch(`./api/photo/${photoId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'deleteComment', commentId: cid }),
    });
    const data = await res.json();
    if (data.ok) {
      modalComments = data.comments;
      renderComments();
      removeMyComment(photoId, cid);
      if (heatMap) heatMap[photoId] = { likes: heatMap[photoId]?.likes || 0, comments: data.comments.length };
      syncComments(photoId, data.comments.length);
    } else if (data.error) {
      alert(data.error);
    }
  } catch (e) {
    alert('删除失败，请稍后再试');
  }
}

commentList.addEventListener('click', e => {
  const del = e.target.closest('.c-del');
  if (del) deleteComment(del.dataset.cid);
});

async function openModal(id) {
  modalId = id;
  const card = gallery.querySelector(`.act-comment[data-id="${id}"]`)?.closest('.photo-card');
  const img = card?.querySelector('img');
  if (img) modalPhoto.src = img.src;
  modal.classList.add('open');
  setScrollLock(true);
  commentList.innerHTML = `<div class="comment-empty">加载中...</div>`;
  modalComments = [];
  try {
    const res = await fetch(`./api/photo/${id}`);
    const data = await res.json();
    modalComments = data.comments || [];
  } catch (e) {
    commentList.innerHTML = `<div class="comment-empty">加载失败，请稍后再试</div>`;
  }
  renderComments();
  commentInput.focus();
}

function closeModal() {
  modal.classList.remove('open');
  setScrollLock(false);
  modalId = null;
}

gallery.addEventListener('click', e => {
  const likeBtn = e.target.closest('.act-like');
  if (likeBtn) { handleLike(likeBtn); return; }
  const comBtn = e.target.closest('.act-comment');
  if (comBtn) { openModal(comBtn.dataset.id); return; }
  const imgWrap = e.target.closest('.photo-img-wrap');
  if (imgWrap && imgWrap.dataset.id) openLightbox(imgWrap.dataset.id);
});

function fmtDate(d) {
  if (!d) return '';
  const s = String(d).trim();
  if (/^\d{10}$/.test(s)) {
    const dt = new Date(parseInt(s, 10) * 1000);
    if (!isNaN(dt.getTime())) {
      return `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, '0')}.${String(dt.getDate()).padStart(2, '0')}`;
    }
  }
  const m = s.match(/^(\d{4})[.\-](\d{2})[.\-](\d{2})/);
  if (m) return `${m[1]}.${m[2]}.${m[3]}`;
  return s;
}

function renderLightbox() {
  const p = lbList[lbIndex];
  lbImage.classList.remove('loaded');
  lbImage.src = p.src;
  lbLike.dataset.id = p.id;
  lbComment.dataset.id = p.id;

  lbLike.classList.toggle('liked', !!localStorage.getItem('liked:' + p.id));
  const share = shareMap[p.id];
  lbCat.textContent = share ? '@' + share.nickname : '';
  lbCat.style.display = share ? '' : 'none';
  lbDate.style.display = 'none';
  const mine = !!(share && localStorage.getItem('ud_nick') === share.nickname);
  lbDel.hidden = !mine;
  lbDel.dataset.id = p.id;
  if (share && share.caption) {
    lbCaption.textContent = share.caption;
    lbCaption.style.display = '';
  } else {
    lbCaption.textContent = '';
    lbCaption.style.display = 'none';
  }
  lbCounter.textContent = `${lbIndex + 1} / ${lbList.length}`;

  const c = heatMap ? heatMap[p.id] : null;
  const likesEl = lbLike.querySelector('.act-count');
  const comEl = lbComment.querySelector('.act-count');
  if (likesEl) likesEl.textContent = c?.likes || 0;
  if (comEl) comEl.textContent = c?.comments || 0;

  lbImage.onload = () => lbImage.classList.add('loaded');
}

function openLightbox(id) {
  const list = buildDisplayList();
  const idx = list.findIndex(p => String(p.id) === String(id));
  if (idx < 0) return;
  lbList = list;
  lbIndex = idx;
  renderLightbox();
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  setScrollLock(true);
  history.replaceState(null, '', '#/photo/' + lbList[lbIndex].id);
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  setScrollLock(false);
  if (/^#\/photo\//.test(location.hash)) {
    history.replaceState(null, '', location.pathname + location.search);
  }
  lbIndex = -1;
  lbList = [];
}

function goLightbox(step) {
  if (lbIndex < 0 || lbList.length === 0) return;
  lbIndex = (lbIndex + step + lbList.length) % lbList.length;
  renderLightbox();
  history.replaceState(null, '', '#/photo/' + lbList[lbIndex].id);
}

lightbox.addEventListener('click', e => {
  const likeBtn = e.target.closest('.act-like');
  if (likeBtn) { handleLike(likeBtn); return; }
  const comBtn = e.target.closest('.act-comment');
  if (comBtn) { openModal(comBtn.dataset.id); return; }
  if (e.target === lightbox || e.target === lbStage) closeLightbox();
});

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => goLightbox(-1));
document.getElementById('lbNext').addEventListener('click', () => goLightbox(1));

lbDel.addEventListener('click', async () => {
  const id = lbDel.dataset.id;
  const nick = localStorage.getItem('ud_nick');
  if (!id || !nick) return;
  if (!confirm('确定删除这条发布？')) return;
  try {
    const res = await fetch('./api/share/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ photoId: id, nickname: nick, secret: localStorage.getItem('ud_secret') || '', device: ud_device }),
    });
    const data = await res.json();
    if (data.ok) {
      closeLightbox();
      await refreshFeed();
      onSort(currentSort);
    } else {
      alert(data.error || '删除失败');
    }
  } catch (e) { alert('网络异常，请重试'); }
});

lbStage.addEventListener('touchstart', e => { lbTouchX = e.touches[0].clientX; }, { passive: true });
lbStage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - lbTouchX;
  if (Math.abs(dx) > 40) goLightbox(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') goLightbox(-1);
  else if (e.key === 'ArrowRight') goLightbox(1);
  else if (e.key === 'Escape') closeLightbox();
});

function handleHash() {
  const m = location.hash.match(/^#\/photo\/(.+)$/);
  if (m && allPhotos.length) openLightbox(decodeURIComponent(m[1]));
}

window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#\/photo\/(.+)$/);
  if (m && !lightbox.classList.contains('open')) openLightbox(decodeURIComponent(m[1]));
  else if (!m && lightbox.classList.contains('open')) closeLightbox();
});

document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

commentForm.addEventListener('submit', async e => {
  e.preventDefault();
  const text = commentInput.value.trim();
  if (!text || !modalId) return;
  commentInput.value = '';
  try {
    const res = await fetch(`./api/photo/${modalId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'comment', text }),
    });
    const data = await res.json();
    if (data.ok) {
      const newOne = data.comments[data.comments.length - 1];
      if (newOne?.id) addMyComment(modalId, newOne.id);
      modalComments = data.comments;
      renderComments();
      if (heatMap) heatMap[modalId] = { likes: heatMap[modalId]?.likes || 0, comments: data.comments.length };
      syncComments(modalId, data.comments.length);
    } else if (data.error) {
      commentInput.value = text;
      alert(data.error);
    }
  } catch (err) {
    commentInput.value = text;
    alert('发送失败，请稍后再试');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closePublish(); closeFeedback(); }
});

/* ─── 反馈 ─── */
document.getElementById('feedbackLink').addEventListener('click', e => {
  e.preventDefault();
  openFeedback();
});

function openFeedback() {
  fbText.value = '';
  fbError.textContent = '';
  feedbackModal.classList.add('open');
  setScrollLock(true);
  fbText.focus();
}

function closeFeedback() {
  feedbackModal.classList.remove('open');
  setScrollLock(false);
}

document.getElementById('fbClose').addEventListener('click', closeFeedback);
feedbackModal.addEventListener('click', e => { if (e.target === feedbackModal) closeFeedback(); });

fbSubmit.addEventListener('click', async () => {
  const text = fbText.value.trim();
  if (!text) { fbError.textContent = '请输入反馈内容'; return; }
  fbSubmit.disabled = true;
  try {
    const res = await fetch('./api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (data.ok) {
      fbText.value = '';
      fbError.textContent = '感谢反馈！';
      setTimeout(closeFeedback, 1200);
    } else {
      fbError.textContent = data.error || '发送失败';
    }
  } catch (e) {
    fbError.textContent = '网络异常，请重试';
  } finally {
    fbSubmit.disabled = false;
  }
});

const FEEDBACK_KEY = 'ud-diary-2024';
const showFeedback = new URLSearchParams(location.search).get('feedback_key') === FEEDBACK_KEY;
if (showFeedback) {
  document.getElementById('navbar').style.display = 'none';
  document.getElementById('gallery').style.display = 'none';
  document.getElementById('loader').style.display = 'none';
  document.getElementById('stats').style.display = 'none';
  feedbackList.style.display = 'block';
  (async () => {
    try {
      const res = await fetch(`./api/feedback?key=${FEEDBACK_KEY}`);
      const list = await res.json();
      if (res.ok) {
        feedbackItems.innerHTML = list.length === 0
          ? '<p style="color:var(--text-muted);text-align:center;padding:2rem;">还没有反馈</p>'
          : list.map(item => `<div class="fb-item"><div class="fb-time">${fmtTime(item.time)}</div><div class="fb-text">${item.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`).join('');
      }
    } catch (e) {}
  })();
}

function openPublish() {
  pubNick.value = localStorage.getItem('ud_nick') || '';
  pubSecret.value = localStorage.getItem('ud_secret') || '';
  pubCaption.value = '';
  pubError.textContent = '';
  pubFile.value = '';
  pubPreview.hidden = true;
  pubPreview.src = '';
  pubPick.classList.remove('picked');
  publishModal.classList.add('open');
  setScrollLock(true);
  pubNick.focus();
}

function closePublish() {
  publishModal.classList.remove('open');
  setScrollLock(false);
}

document.getElementById('publishBtn').addEventListener('click', openPublish);
document.getElementById('pubClose').addEventListener('click', closePublish);
publishModal.addEventListener('click', e => { if (e.target === publishModal) closePublish(); });

pubPick.addEventListener('click', () => pubFile.click());

pubFile.addEventListener('change', () => {
  const f = pubFile.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) { pubError.textContent = '请选择图片文件'; return; }
  if (f.size > 15 * 1024 * 1024) { pubError.textContent = '原图请勿超过 15MB'; return; }
  pubPreview.src = URL.createObjectURL(f);
  pubPreview.hidden = false;
  pubPick.classList.add('picked');
  pubError.textContent = '';
});

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 2000;
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const width = Math.round(img.naturalWidth * scale);
      const height = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      if (file.type === 'image/png') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height); }
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('compress fail')), 'image/jpeg', 0.85);
    };
    img.onerror = () => reject(new Error('bad image'));
    img.src = URL.createObjectURL(file);
  });
}

pubSubmit.addEventListener('click', async () => {
  const file = pubFile.files[0];
  const nickname = pubNick.value.trim();
  if (!file) { pubError.textContent = '请先选择图片'; return; }
  if (!nickname) { pubError.textContent = '请输入昵称'; return; }
  if (!pubSecret.value.trim()) { pubError.textContent = '请填写口令'; return; }

  pubSubmit.disabled = true;
  pubError.textContent = '';
  try {
    const claimRes = await fetch('./api/auth/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname, secret: pubSecret.value.trim(), device: ud_device }),
    });
    const claimData = await claimRes.json();
    if (!claimData.ok) { pubError.textContent = claimData.error || '昵称校验失败'; return; }

    const blob = await compressImage(file);
    const base = (file.name || 'photo').replace(/\.[^.]+$/, '');
    const fd = new FormData();
    fd.append('file', new File([blob], base + '.jpg', { type: 'image/jpeg' }));
    fd.append('nickname', nickname);
    fd.append('secret', pubSecret.value.trim());
    fd.append('caption', pubCaption.value.trim());
    fd.append('device', ud_device);

    const res = await fetch('./api/share', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('ud_nick', nickname);
      localStorage.setItem('ud_secret', pubSecret.value.trim());
      closePublish();
      await refreshFeed();
      onSort(currentSort);
    } else { pubError.textContent = data.error || '发布失败'; }
  } catch (e) { pubError.textContent = '网络异常，请重试'; }
  finally { pubSubmit.disabled = false; }
});

if (window.matchMedia('(pointer: fine)').matches) {
  const MAX_TILT = 3;
  let ticking = false;

  gallery.addEventListener('mousemove', e => {
    const card = e.target.closest('.photo-card');
    if (!card) return;
    if (!ticking) {
      requestAnimationFrame(() => {
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        card.style.setProperty('--rx', ((0.5 - py) * MAX_TILT).toFixed(2) + 'deg');
        card.style.setProperty('--ry', ((px - 0.5) * MAX_TILT).toFixed(2) + 'deg');
        ticking = false;
      });
      ticking = true;
    }
  });

  gallery.addEventListener('mouseleave', () => {
    gallery.querySelectorAll('.photo-card').forEach(c => {
      c.style.setProperty('--rx', '0deg');
      c.style.setProperty('--ry', '0deg');
    });
  });
}

loadPhotos();
